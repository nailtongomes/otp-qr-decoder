name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Check vendored library hashes
        run: node scripts/verify-vendor-hashes.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          # ubuntu-latest already has the shared libraries. --with-deps also
          # apt-installs recommended fonts, and that mirror failed DNS on this run.
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              exit 0
            fi
            echo "browser download failed (attempt ${attempt})"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Test
        run: npm test
