<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src https://arquivos.n3wizards.com https://minio.n3wizards.com; form-action 'none'; base-uri 'none'">
  <meta name="description" content="Decode otpauth QR codes locally in your browser. Secrets are not uploaded.">
  <meta name="theme-color" content="#0d4f3c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10241c" media="(prefers-color-scheme: dark)">
  <title>OTP QR decoder</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <button type="button" class="skip" id="skip" data-i18n="skip"></button>
  <pre id="code" class="machine" hidden></pre>
  <pre id="json" class="machine json" hidden></pre>
  <div class="wrap">
    <header class="top">
      <div>
        <p class="kicker" data-i18n="kicker"></p>
        <h1 data-i18n="title"></h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>
      <div class="langs" id="lang-group" role="group" data-i18n-aria="langLabel">
        <button type="button" id="mute" aria-pressed="false"></button>
        <button type="button" id="lang-pt" aria-pressed="true">PT-BR</button>
        <button type="button" id="lang-en" aria-pressed="false">EN</button>
      </div>
    </header>

    <section aria-labelledby="clock-heading">
      <h2 id="clock-heading" data-i18n="clockHeading"></h2>
      <p id="clock-note" class="clock-note" data-i18n="clockNote"></p>
      <dl class="clock-grid">
        <div class="clock">
          <dt id="label-device" data-i18n="clockDevice"></dt>
          <dd id="clock-device"></dd>
        </div>
        <div class="clock">
          <dt id="label-utc" data-i18n="clockUtc"></dt>
          <dd id="clock-utc"></dd>
        </div>
        <div class="clock">
          <dt id="label-ref" data-i18n="clockRef"></dt>
          <dd id="clock-ref"></dd>
        </div>
      </dl>
      <label class="field" for="tz" data-i18n="tzLabel"></label>
      <select id="tz"></select>
      <p class="help" data-i18n="tzHelp"></p>
    </section>

    <section aria-labelledby="input-heading">
      <h2 id="input-heading" data-i18n="inputHeading"></h2>
      <label id="drop" class="drop">
        <strong data-i18n="dropTitle"></strong>
        <span class="help" id="drop-help" data-i18n="dropHelp"></span>
        <input id="file" class="file" type="file" multiple accept="image/png,image/jpeg,image/webp,.pdf,application/pdf" aria-describedby="drop-help">
      </label>
      <label class="field" for="fallback" data-i18n="fallbackLabel"></label>
      <textarea id="fallback" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>
      <p class="help" data-i18n="fallbackHelp"></p>
      <div class="row-actions">
        <button type="button" id="decode-text" class="primary" data-i18n="decodeText"></button>
        <button type="button" id="toggle-input" aria-pressed="false"></button>
      </div>
    </section>

    <section aria-labelledby="results-heading">
      <div class="results-head">
        <h2 id="results-heading" data-i18n="resultsHeading"></h2>
        <button type="button" id="clear" class="danger" data-i18n="clear"></button>
      </div>
      <p id="webcrypto" class="callout" hidden data-i18n="webcrypto"></p>
      <div id="status" class="status" role="status"></div>
      <div id="results" tabindex="-1"></div>
    </section>

    <details class="learn">
      <summary data-i18n="learnMore"></summary>
      <div class="prose">
      <h2 id="privacy-heading" data-i18n="privacyHeading"></h2>
      <p data-i18n="privacyLead"></p>
      <ul>
        <li data-i18n="p1"></li>
        <li data-i18n="p2"></li>
        <li data-i18n="p3"></li>
        <li data-i18n="p4"></li>
        <li data-i18n="p5"></li>
        <li data-i18n="p6"></li>
        <li data-i18n="p7"></li>
      </ul>
      <h2 data-i18n="verifyHeading"></h2>
      <ol>
        <li data-i18n="v1"></li>
        <li data-i18n="v2"></li>
        <li data-i18n="v3"></li>
      </ol>
      <h2 data-i18n="timeHeading"></h2>
      <ul>
        <li data-i18n="t1"></li>
        <li data-i18n="t2"></li>
        <li data-i18n="t3"></li>
      </ul>
      <h2 data-i18n="fileHeading"></h2>
      <ul>
        <li data-i18n="f1"></li>
        <li data-i18n="f2"></li>
        <li data-i18n="f3"></li>
      </ul>
      </div>
    </details>

    <footer>
      <p data-i18n="footer"></p>
    </footer>
  </div>
  <noscript>
    <p>This page needs JavaScript. It runs only in your browser. Nothing is uploaded.</p>
    <p>Esta página precisa de JavaScript. Ele roda só no seu navegador. Nada é enviado.</p>
  </noscript>
  <script defer src="js/params.js" referrerpolicy="no-referrer"></script>
  <script defer src="vendor/jsqr/jsQR.js" referrerpolicy="no-referrer"></script>
  <script defer src="js/totp.js" referrerpolicy="no-referrer"></script>
  <script defer src="js/migration.js" referrerpolicy="no-referrer"></script>
  <script defer src="js/parse.js" referrerpolicy="no-referrer"></script>
  <script defer src="js/qr.js" referrerpolicy="no-referrer"></script>
  <script defer src="js/i18n.js" referrerpolicy="no-referrer"></script>
  <script defer src="js/app.js" referrerpolicy="no-referrer"></script>
</body>
</html>
